when:
  event:
    - tag
  branch:
    - main
steps:
  build-and-push:
    image: woodpeckerci/plugin-docker-buildx:5.1.0-insecure
    privileged: true
    settings:
      registry: kube-registry.kube-system.svc.cluster.local:5000
      repo: kube-registry.kube-system.svc.cluster.local:5000/exercises-for-ai
      dockerfile: Dockerfile
      context: .
      platforms:
        - linux/arm64
      tags:
        - ${CI_COMMIT_TAG}
      insecure: true
      buildkit_config: |
        [registry."kube-registry.kube-system.svc.cluster.local:5000"]
          http = true
          insecure = true
  update-gitops:
    depends_on: [build-and-push]
    image: alpine/git:2.49.1
    environment:
      GITOPS_TOKEN:
        from_secret: gitops_token
    commands:
      - git config --global url."https://x-access-token:$GITOPS_TOKEN@github.com/".insteadOf "https://github.com/"
      - git clone https://github.com/chrisallmark/gitops.git
      - cd gitops
      - git config user.name "woodpecker-ci"
      - git config user.email "woodpecker-ci@homelab.local"
      - |
        sed -i "s|image: .*exercises-for-ai:.*|image: k3s:5000/exercises-for-ai:${CI_COMMIT_TAG}|" apps/exercises-for-ai/deployment.yaml
      - git diff
      - git add apps/exercises-for-ai/deployment.yaml
      - git commit -m "Deploy exercises-for-ai ${CI_COMMIT_TAG}" || echo "No GitOps changes to commit"
      - git push origin main
